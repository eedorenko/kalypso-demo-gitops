apiVersion: v1
kind: Namespace
metadata:
  name: "prod-cke-burger-detection-prod-gray" 
  labels:
    environment: "prod"
    workspace: "dt"
    workload: "burger-detection"
    deploymentTarget: "burger-detection-prod-gray"
    someLabel: some-value
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: "burger-detection-sa"
  namespace: "prod-cke-burger-detection-prod-gray"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: pvc-limit-range
  namespace: "prod-cke-burger-detection-prod-gray"
  labels:
    environment: "prod"
    workload: "burger-detection"
spec:
  limits:
  - max:
      storage: 64Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: pvc-resource-quota
  namespace: "prod-cke-burger-detection-prod-gray"
  labels:
    environment: "prod"
    workload: "burger-detection"
spec:
  hard:
    requests.storage: 64Gi