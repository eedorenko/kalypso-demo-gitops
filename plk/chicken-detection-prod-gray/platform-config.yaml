apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: prod-plk-chicken-detection-prod-gray
data:
  ENVIRONMENT: Prod
  SOME_COMMON_ENVIRONMENT_VARIABLE: "false"
  brand_id: plk
  model_class_mapping: '{0: raw_chicken_wing, 1:raw_chicken_thigh, 2:raw_chicken_drum,
    3:raw_chicken_breast, 4: cooked_chicken_wing, 5: cooked_chicken_thigh, 6: cooked_chicken_drum,
    7:cooked_chicken_breast}'
  model_confidence_threshold: "0.75"
  task_type: object_detection
  vision_dayparts: lunch 11AM - 1PM
  worker_cameras: '["centerpost_rear"]'
  worker_operating_fps: "6"
  worker_tracker_distance_function: kou
  worker_tracker_distance_threshold: "0.75"
  worker_tracker_name: norfair
  worker_zones: '["centerpost_rear/chicken_trays", "center_post_rear/table"]'
  worker_zones_rentry_buffer_time: 2s
  worker_zones_zone_boundary_threshold: 5 pixels
