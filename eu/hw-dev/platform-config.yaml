apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: dev-eu-hw-dev
data:
  CLUSTER_NAME: Factory Cluster
  DATABASE_URL: mysql://eu-db-host:3308/mysql
  ENVIRONMENT: Dev
  REGION: EU
  SOME_COMMON_ENVIRONMENT_VARIABLE: "true"
  keyVaultSecrets: |
    - |
      objectName: application-secret
      objectType: secret
  secretObjects: |
    - data:
      - sourcePath: application-secret
        targetKey: application-secret-value
      secretName: application-secret
      type: Opaque
