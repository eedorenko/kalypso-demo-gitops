apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: dev.dt.kos.burger-detection.burger-detection-dev
  namespace: flux-system
spec:
  interval: 30s
  url: "https://github.com/eedorenko/mlops-gitops-gitops"
  ref:
    branch: "dev"
  secretRef:
      name: repo-secret    
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: dev.dt.kos.burger-detection.burger-detection-dev
  namespace: flux-system
spec:
  interval: 30s
  targetNamespace: "dev-west-us-burger-detection-dev"
  sourceRef:
    kind: GitRepository
    name: dev.dt.kos.burger-detection.burger-detection-dev
  path: "./burger-detection" 
  prune: true
