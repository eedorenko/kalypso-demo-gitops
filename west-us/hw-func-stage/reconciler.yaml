apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: stage.kaizen-team.hello-world.hw.hw-func-stage
  namespace: flux-system
spec:
  interval: 30s
  url: "https://github.com/eedorenko/hello-world-gitops"
  ref:
    branch: "stage"
  secretRef:
      name: repo-secret    
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: stage.kaizen-team.hello-world.hw.hw-func-stage
  namespace: flux-system
spec:
  interval: 30s
  targetNamespace: "stage-west-us-hw-func-stage"
  sourceRef:
    kind: GitRepository
    name: stage.kaizen-team.hello-world.hw.hw-func-stage
  path: "./hw-func" 
  prune: true
