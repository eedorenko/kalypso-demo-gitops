apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: stage.dt.kos.burger-detection.burger-detection-stage
  namespace: flux-system
spec:
  interval: 30s
  url: "https://github.com/eedorenko/mlops-gitops-gitops"
  ref:
    branch: "stage"
  secretRef:
      name: repo-secret    
---
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: stage.dt.kos.burger-detection.burger-detection-stage
  namespace: flux-system
spec:
  interval: 30s
  targetNamespace: "stage-west-us-burger-detection-stage"
  sourceRef:
    kind: GitRepository
    name: stage.dt.kos.burger-detection.burger-detection-stage
  path: "./burger-detection" 
  prune: true
