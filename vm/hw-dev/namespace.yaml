---
- hosts: localhost
  tasks:
  - name: create a user
    ansible.builtin.user:
        name: dev-hw-dev
  - name: cope platform configs
    ansible.builtin.copy:
        src: ./platform-config.sh
        dest: /home/dev-hw-dev/platform-config.sh
        owner: dev-hw-dev
        group: dev-hw-dev
        mode: u+rw,g-wx,o-rwx
